name:             morloc
version:          0.113.0
homepage:         https://github.com/morloc-project/morloc
synopsis:         A multi-lingual, typed, workflow language
description: |
  Morloc is a typed, multi-lingual workflow language that composes functions
  across Python, C++, R, and other languages under a unified type system.
  The compiler generates interprocess communication code, serialization
  logic, and a dispatch binary from a single morloc source file.
  See the GitHub README <https://github.com/morloc-project/morloc#readme>
  for full documentation.
category:         Language, Compiler, Code Generation
tested-with:      GHC == 9.6.6
license:          Apache-2.0
license-file:     LICENSE
author:           "Zebulun Arendsee" 
maintainer:       "z@morloc.io"
github:           "morloc-project/morloc"
bug-reports:      https://github.com/morloc-project/morloc/issues
copyright:        "2026 Zebulun Arendsee"

extra-source-files:
  - README.md
  - ChangeLog.md
  # libraries
  - binders/cpp/pool.cpp
  # universal c header
  - runtime/include/morloc.h
  # shared language config
  - binders/languages.yaml
  # dependency/requirements config (core toolchain + per-language)
  - binders/requirements.yaml
  - binders/py/requirements.yaml
  - binders/r/requirements.yaml
  - binders/cpp/requirements.yaml
  - binders/rust/requirements.yaml
  # per-language files
  - binders/c/lang.yaml
  - binders/cpp/lang.yaml
  - binders/cpp/cppmorloc.hpp
  - binders/cpp/mlc_rec.hpp
  - binders/cpp/cppmorloc.cpp
  - binders/cpp/morloc_pch.hpp
  - binders/cpp/pool.cpp
  - binders/cpp/init.sh
  - binders/py/lang.yaml
  - binders/py/pymorloc.c
  - binders/py/setup.py
  - binders/py/Makefile
  - binders/py/pool.py
  - binders/py/init.sh
  - binders/r/lang.yaml
  - binders/r/rmorloc.c
  - binders/r/pool.R
  - binders/r/init.sh
  - binders/rust/rustmorloc/Cargo.toml
  - binders/rust/rustmorloc/Cargo.lock
  - binders/rust/rustmorloc/build.rs
  - binders/rust/rustmorloc/src/*.rs

default-extensions:
  - TypeOperators

dependencies:
  - base
  - aeson
  - binary
  - array
  - bytestring
  - containers
  - directory
  - directory-tree
  - extra
  - filepath
  - file-embed
  - haskell-src-meta
  - http-conduit
  - http-types
  - mtl
  - parsec
  - partial-order
  - pretty-simple
  - prettyprinter
  - process
  - raw-strings-qq
  - safe
  - scientific
  - template-haskell
  - text
  - time
  - transformers
  - unix
  - unordered-containers
  - vector
  - xxhash-ffi
  - yaml
  - zip-archive

ghc-options:
  - -Wall
  - -Wcompat
  - -fwarn-unused-binds
  - -fwarn-unused-imports
  - -fwarn-tabs
  - -fwarn-incomplete-uni-patterns
  - -Wincomplete-patterns
  - -Werror=incomplete-patterns
  - -Werror=missing-fields
  - -fwarn-incomplete-record-updates
  - -fwarn-redundant-constraints
  - -fno-warn-missing-signatures
  - -fno-warn-unused-do-bind
  - -fno-warn-orphans
  - -haddock

library:
  source-dirs: library
  build-tools:
    - happy

executables:
  morloc:
    main:          Main.hs
    source-dirs:   executable
    ghc-options:
      - -Wall
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -O2
      - -haddock
    dependencies:
      - morloc
      - base
      - optparse-applicative
      - temporary
      - text

tests:
  morloc-test:
    main:          Main.hs
    source-dirs:
      - test-suite
      - test-suite/harness
      - test-suite/unit
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - morloc
      - base
      - QuickCheck
      - tasty
      - tasty-golden
      - tasty-hunit
      - tasty-quickcheck

  morloc-integration-test:
    main:          Main.hs
    source-dirs:   test-suite/integration
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - morloc
      - base
      - async
      - directory
      - filepath
      - process
      - tasty
      - tasty-hunit
      - temporary
      - text
      - time
      - unix
