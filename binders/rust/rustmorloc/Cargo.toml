[package]
name = "rustmorloc"
version = "0.114.0"
edition = "2021"
description = "Direct voidstar <-> native-Rust marshaller for the morloc Rust pool member"

[lib]
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
# The same relative path in the source tree (binders/rust/rustmorloc) and
# where init installs it ($MORLOC_HOME/lang/rust/rustmorloc-<hash>) reaches the
# runtime source (runtime/, $MORLOC_HOME/runtime).
morloc-runtime-types = { path = "../../../runtime/morloc-runtime-types" }
# Tables cross as Arrow record batches through the C Data Interface.
arrow-array = { version = "58", features = ["ffi"] }
arrow-schema = "58"

[dev-dependencies]
# Tests round-trip through the pure marshalling walk against a local buffer
# (buffer-relative relptrs), so they need no libmorloc.so / SHM state.
