SPECIFICATION Spec
CONSTANT Variant = "checkout_by_thread"
CONSTANT Mode = "fold"
CONSTANT MaxPuts = 3
CONSTANT MaxForks = 1
CONSTANT ChildForks = 0
CONSTANT OpenMayFail = FALSE
CONSTANT StepMayFail = FALSE
CONSTANT PutMayFail = FALSE
INVARIANTS
    TakeHoldsEveryReturnedPut
    NothingTakenTwice
    TakeKeepsCausalOrder
    ALostPutFailsTheTake
    AFailedOpenFailsTheTake
    AChildNeverClosesTheSide
    AForkedChildSeesASettledEntry
    AFoldPutNeverReturnsAfterTheSeal
    AFailedStepFailsTheFold
    AFoldKeepsASequentialProducersOrder
    AFoldHasNoMoreSlotsThanConcurrentPuts
