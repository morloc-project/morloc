name: CI

# Build morloc and run the standard test target on every push to master or dev,
# on both Linux and macOS (Apple Silicon). fail-fast is off so a red macOS leg
# never cancels the (authoritative) Linux leg.
on:
  push:
    branches: [master, dev]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive
      # Dump a C+Python traceback on a fatal signal (SIGSEGV/SIGABRT/SIGBUS) from
      # any Python pool worker, so a silent macOS crash shows WHERE it died in the
      # captured obs.err (harmless on success -- only prints on a fatal signal).
      PYTHONFAULTHANDLER: "1"
      # macOS "nano" malloc zone is not fork-safe; disabling it both reduces
      # fork-related aborts and helps confirm the allocator-fork diagnosis.
      # No-op on Linux.
      MallocNanoZone: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache GHC toolchain (ghcup, macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          # Restored before the Haskell setup so it skips re-downloading GHC.
          path: ~/.ghcup
          key: ghcup-macos-9.6.7

      - name: Setup Haskell (GHC + Stack)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          enable-stack: true
          stack-version: 'latest'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-${{ matrix.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
          restore-keys: |
            stack-${{ matrix.os }}-

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.os }}-${{ hashFiles('data/rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      - name: Increase shared memory (needed for morloc SHM pool tests)
        if: runner.os == 'Linux'
        run: sudo mount -o remount,size=4G /dev/shm

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base \
            python3 \
            python3-dev \
            python3-pip \
            python3-numpy \
            g++ \
            gcc \
            make \
            libgsl-dev
          python3 -m pip install --break-system-packages --upgrade setuptools numpy pyarrow

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # R is essential (fatal on failure). Futhark is needed only by the 7
          # futhark goldens, so keep it non-fatal -- a missing/renamed formula
          # must not abort the whole leg before the other ~580 goldens run.
          brew install r
          brew install futhark || echo "WARNING: futhark unavailable; futhark goldens will fail"
          # Provide GNU `timeout` (macOS lacks it): several compile-guard goldens
          # call `timeout Ns morloc make`. coreutils ships it as `gtimeout`.
          brew install coreutils
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(brew --prefix)/bin/gtimeout" "$HOME/.local/bin/timeout"
          # Force a UTF-8 locale for later steps: a non-UTF-8 default locale on
          # the macOS runner breaks R's handling of multibyte (e.g. CJK) strings.
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"
          python3 -m pip install --break-system-packages --upgrade setuptools numpy pyarrow
          R --version

      - name: Install Futhark (hosted-guest toolchain; not in apt) (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://futhark-lang.org/releases/futhark-0.26.4-linux-x86_64.tar.xz -o /tmp/futhark.tar.xz
          tar -xf /tmp/futhark.tar.xz -C /tmp
          make -C /tmp/futhark-0.26.4-linux-x86_64 install PREFIX="$HOME/.local"

      - name: Cache R packages
        uses: actions/cache@v4
        id: r-cache
        with:
          path: ~/R/library
          key: r-lib-${{ runner.os }}-${{ runner.arch }}

      - name: Install R packages
        if: steps.r-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/R/library
          # bit64: Int64/UInt64 support (loaded by the root-r preamble). arrow:
          # Table goldens. On Linux arrow pulls bit64 transitively; install both
          # explicitly so macOS gets bit64 too.
          LIBARROW_MINIMAL=true ARROW_S3=OFF ARROW_GCS=OFF \
            Rscript -e 'install.packages(c("bit64","arrow"), lib="~/R/library", repos = "https://cloud.r-project.org")'

      - name: Add morloc bin folders to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/morloc/bin" >> $GITHUB_PATH
          echo "R_LIBS_USER=$HOME/R/library" >> $GITHUB_ENV

      - name: Build Morloc
        run: |
          stack install --system-ghc --no-install-ghc --no-run-tests

      - name: Initialize morloc and install modules
        run: |
          MORLOC_RUST_DIR=$(pwd)/data/rust morloc init -f
          morloc install stdlib

      - name: Test rust runtime and nexus
        run: cargo test --workspace --manifest-path data/rust/Cargo.toml
        timeout-minutes: 20

      - name: Test morloc
        run: |
          stack test --system-ghc --no-install-ghc morloc:morloc-test
        timeout-minutes: 60

      - name: Dump failing golden-test stderr to log
        if: failure()
        run: |
          # Print every non-empty obs.err / build.err under the golden tests
          # straight to the CI log, so failure stderr (e.g. pool-crash
          # diagnostics) is visible even when the uploaded artifact is not
          # convenient to fetch. Cap each file so the log stays readable.
          echo "=== non-empty golden-test stderr ==="
          found=0
          for f in $(find test-suite/golden-tests -name obs.err -o -name build.err 2>/dev/null); do
            if [ -s "$f" ]; then
              found=1
              echo "----- $f -----"
              head -c 4000 "$f"
              echo
            fi
          done
          [ "$found" = 0 ] && echo "(no non-empty obs.err/build.err found)"
          true

      - name: Collect macOS crash reports
        if: failure() && runner.os == 'macOS'
        run: |
          # macOS writes a .ips crash report per crashed process, naming the
          # binary (python3 / Rscript / pool-cpp.out / morloc-nexus), the
          # termination signal, and a backtrace. This tells us WHICH pool died in
          # a cross-language "Connection closed by peer" (the nexus error only
          # shows the caller). Best-effort: the CI crash reporter may be delayed.
          mkdir -p crash-reports
          cp "$HOME/Library/Logs/DiagnosticReports/"*.ips crash-reports/ 2>/dev/null || true
          cp "/Library/Logs/DiagnosticReports/"*.ips crash-reports/ 2>/dev/null || true
          echo "=== crash report summaries (crashed process, signal, top frames) ==="
          for f in crash-reports/*.ips; do
            [ -e "$f" ] || { echo "(no crash reports found)"; break; }
            echo "----- $f -----"; head -c 3000 "$f"; echo
          done

      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-errs-${{ matrix.os }}
          path: |
            test-suite/golden-tests/**/build.err
            test-suite/golden-tests/**/obs.err
            test-suite/golden-tests/**/obs.txt
            crash-reports/**
          if-no-files-found: ignore
          retention-days: 7
