# Release workflow: build all binaries, run tests, publish release.
#
# Triggered by pushing a version tag:
#   git tag v0.68.0
#   git push origin v0.68.0
#
# Produces (linux-x86_64, linux-arm64, macos-arm64):
#   - morloc  (the Haskell compiler; Linux triples build in container/static-build
#     at glibc 2.31, macos-arm64 builds natively on an Apple Silicon runner)
# plus the platform-independent Rust workspace source and a
# `morloc-release-manifest.json` describing the provisionable assets per triple.
#
# libmorloc.so and morloc-nexus are NOT prebuilt: `morloc init` builds them from
# the bundled Rust source with the target env's own toolchain, so the runtime is
# ABI-coherent with the pools it links. Only the compiler (GHC-built) ships
# prebuilt. The mim environment manager is built and released from its own
# repository (morloc-project/morloc-manager).

name: Release

on:
  push:
    tags: ['v*']

jobs:
  # ---- Build the prebuilt release assets (compiler + rust source) per platform ----
  rust-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    # The Linux build stack-builds the morloc compiler (cold, no cross-run cache
    # on ephemeral runners), which dominates the wall time.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ---- Linux: Docker container build ----
      # morloc compiler: Haskell/stack (Ubuntu 20.04)
      # rust source: bundled for from-source `morloc init`
      - name: Set up Docker Buildx (Linux)
        uses: docker/setup-buildx-action@v3

      - name: Build compiler + rust source (Linux)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/static-build/Dockerfile
          tags: morloc-rust-build
          load: true
          # GHA layer cache (unlike --mount=type=cache) persists across runs, when
          # not evicted from the repo's ~10 GB LRU pool between infrequent tag builds.
          # mode=max is needed to cache the intermediate GHC dependency stage; scope
          # is per-platform so x86_64 and arm64 do not clobber each other.
          cache-from: type=gha,scope=static-build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=static-build-${{ matrix.platform }}

      - name: Extract assets (Linux)
        run: |
          mkdir -p out
          docker run --rm -v "$(pwd)/out:/out" morloc-rust-build

      - name: Rename artifacts (Linux)
        run: |
          mv out/morloc out/morloc-${{ matrix.platform }}
          # out/rust/ (the workspace source) is uploaded as-is via out/*

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries-${{ matrix.platform }}
          path: out/*

  # ---- Build the macOS compiler natively (no container path on macOS) ----
  # Apple Silicon runners are arm64; there is no glibc floor to manage (macOS
  # binaries link the system dyld), so the compiler is stack-built directly.
  # Only the compiler binary is uploaded -- the platform-independent rust/
  # source is carried by the Linux jobs and merged at release time.
  compiler-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          enable-stack: true
          stack-version: 'latest'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack/snapshots
            ~/.stack/setup-exe-cache
            .stack-work
          key: stack-deps-release-macos-${{ hashFiles('stack.yaml.lock', 'package.yaml') }}
          restore-keys: stack-deps-release-macos-
      - name: Build morloc compiler
        run: stack install --system-ghc --no-install-ghc --no-run-tests
      - name: Stage compiler binary
        run: |
          mkdir -p out
          cp "$HOME/.local/bin/morloc" out/morloc-macos-arm64
          # -x (strip local symbols only) is the safe Mach-O variant; a bare
          # `strip` can fail on indirect symbol-table entries in GHC binaries.
          strip -x out/morloc-macos-arm64
      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries-macos-arm64
          path: out/morloc-macos-arm64

  # ---- Run tests using the Rust binaries ----
  test:
    needs: rust-binary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      # rustc/cargo: morloc make compiles Rust pools, and morloc init builds
      # libmorloc.so + morloc-nexus + the rustmorloc rlib from the bundled
      # sources (prebuilt/rust) with this toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          enable-stack: true
          stack-version: 'latest'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack/snapshots
            ~/.stack/setup-exe-cache
            .stack-work
          key: stack-deps-release-${{ hashFiles('stack.yaml.lock', 'package.yaml') }}
          restore-keys: stack-deps-release-
      - name: Increase shared memory
        run: sudo mount -o remount,size=4G /dev/shm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base-core python3 python3-dev python3-pip \
            python3-numpy g++ gcc make libgsl-dev
          python3 -m pip install --break-system-packages --upgrade setuptools pyarrow

      - name: Install Futhark (hosted-guest toolchain; not in apt)
        run: |
          curl -sSL https://futhark-lang.org/releases/futhark-0.26.4-linux-x86_64.tar.xz -o /tmp/futhark.tar.xz
          tar -xf /tmp/futhark.tar.xz -C /tmp
          make -C /tmp/futhark-0.26.4-linux-x86_64 install PREFIX="$HOME/.local"

      - name: Cache R packages
        uses: actions/cache@v4
        id: r-cache
        with:
          path: ~/R/library
          key: r-lib-${{ runner.os }}-${{ runner.arch }}

      - name: Install R packages
        if: steps.r-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/R/library
          LIBARROW_MINIMAL=true ARROW_S3=OFF ARROW_GCS=OFF \
            Rscript -e 'install.packages("arrow", lib="~/R/library", repos = "https://cloud.r-project.org")'

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-linux-x86_64
          path: rust-bin

      - name: Prepare Rust source
        run: |
          mkdir -p prebuilt
          # morloc init builds libmorloc.so + morloc-nexus + rustmorloc from these
          mv rust-bin/rust prebuilt/rust

      - name: Add morloc to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/morloc/bin" >> $GITHUB_PATH
          echo "R_LIBS_USER=$HOME/R/library" >> $GITHUB_ENV
      - name: Build morloc
        run: stack install --system-ghc --no-install-ghc --no-run-tests
      - name: Initialize morloc (build runtime from source)
        run: |
          MORLOC_RUST_DIR=$(pwd)/prebuilt/rust morloc init -f
          morloc install stdlib
      - name: Run tests
        run: stack test --system-ghc --no-install-ghc morloc:morloc-test
        timeout-minutes: 10

      # The shipped compiler comes from the rust-binary job's static-build image
      # (Ubuntu 20.04, glibc >= 2.31 -- forward-compatible on any newer host),
      # NOT this job's stack build (ubuntu-latest, a much newer glibc floor). The
      # test suite here validates that same commit; no separate compiler asset is
      # staged, so there is no glibc-floor collision on `morloc-linux-x86_64`.

      # Publish the language-support table (compiler-owned static data) as a
      # release asset so mim can render pixi manifests WITHOUT running
      # the compiler on the host -- essential for container builds on hosts where
      # the glibc compiler cannot execute natively (NixOS, musl, etc.).
      - name: Stage lang-support table for release
        run: morloc lang-support > morloc-lang-support.json
      - name: Upload lang-support table
        uses: actions/upload-artifact@v4
        with:
          name: morloc-lang-support
          path: morloc-lang-support.json

      # The contract/ABI versions this compiler emits, sourced from its central
      # constants. Inlined into the release manifest (not published as a separate
      # asset) so the manager gets a pre-install compatibility gate from the fetch
      # it already makes.
      - name: Stage versions doc
        run: morloc versions > morloc-versions.json
      - name: Upload versions doc
        uses: actions/upload-artifact@v4
        with:
          name: morloc-versions
          path: morloc-versions.json

  # ---- Create GitHub Release ----
  release:
    # Gate only on tests: a macOS build failure must not block the Linux release.
    # The manifest generator omits any triple whose asset is missing, so a failed
    # compiler-macos simply drops macos-arm64 from the release.
    if: always() && needs.test.result == 'success'
    needs: [test, rust-binary, compiler-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # rust-binaries-* carries, per triple, the morloc compiler (glibc >= 2.31
      # from static-build) and the rust/ source. The mim manager is released
      # from its own repo (morloc-project/morloc-manager), not bundled here.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'rust-binaries-*'
          merge-multiple: true

      - name: Download the lang-support table
        uses: actions/download-artifact@v4
        with:
          name: morloc-lang-support

      - name: Download the versions doc
        uses: actions/download-artifact@v4
        with:
          name: morloc-versions

      - name: List artifacts
        run: ls -lh

      # The entire ABI-bearing runtime (libmorloc.so, morloc-nexus, and the
      # rustmorloc rlib) is built from this source by `morloc init` with the
      # target env's own toolchain, so it ships as platform-independent source
      # rather than prebuilt binaries. Consumers unpack it as MORLOC_RUST_DIR.
      - name: Package Rust sources
        run: tar czf morloc-rust-src.tar.gz rust

      # A version manifest for the native-install download flow: which loose
      # artifacts make up the provisionable set per platform triple, plus the
      # release version. libmorloc.so and morloc-nexus are NOT listed: they are
      # built from the shared rust_src at init time. The mim manager is NOT
      # listed either -- it is released from its own repo
      # (morloc-project/morloc-manager). Only triples with a complete asset set are
      # listed; Intel macOS is omitted (no prebuilt compiler), so the flow falls
      # through to a container there.
      # Built with Python so the manifest carries a SHA-256 for every published
      # asset (the download flow verifies each fetch against these) and lists a
      # triple ONLY when all of its artifacts exist on disk -- a partial triple
      # would otherwise 404 at download time. Digests + presence are computed
      # from the actual files staged for the Release.
      - name: Generate native-install manifest
        run: |
          python3 - <<'PY'
          import json, hashlib, os
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 16), b""):
                      h.update(chunk)
              return h.hexdigest()

          candidates = {
              "linux-x86_64": {
                  "morloc": "morloc-linux-x86_64",
              },
              "linux-arm64": {
                  "morloc": "morloc-linux-arm64",
              },
              "macos-arm64": {
                  "morloc": "morloc-macos-arm64",
              },
          }
          rust_src = "morloc-rust-src.tar.gz"
          extra = ["morloc-lang-support.json"]

          triples, digests = {}, {}
          for triple, assets in candidates.items():
              missing = [a for a in assets.values() if not os.path.exists(a)]
              if missing:
                  print(f"omitting triple {triple}; missing {missing}")
                  continue
              triples[triple] = assets
              for a in assets.values():
                  digests[a] = sha256(a)
          for a in [rust_src, *extra]:
              if os.path.exists(a):
                  digests[a] = sha256(a)

          # The contract/ABI versions the compiler emits, inlined so the manager
          # gets its pre-install compatibility gate from the manifest it already
          # fetches (no separate asset to publish or fetch).
          with open("morloc-versions.json") as f:
              versions = json.load(f)

          manifest = {
              "schema": 1,
              "version": version,
              "rust_src": rust_src,
              "versions": versions,
              "triples": triples,
              "sha256": digests,
          }

          # Fail closed: every asset the manifest REQUIRES the manager to download
          # (the rust source + each triple's binaries) must carry a digest, since a
          # missing digest is a hard error on the manager side. Catch it here rather
          # than shipping a manifest that bricks native install.
          required = {rust_src} | {a for t in triples.values() for a in t.values()}
          no_digest = sorted(a for a in required if a not in digests)
          if no_digest:
              raise SystemExit(f"manifest references assets with no SHA-256 digest: {no_digest}")

          with open("morloc-release-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Fetch stdlib module-pin snapshot
        run: |
          # stdlib is built/tested on the dev compiler and pushed BEFORE this
          # release, so its committed snapshot.txt is this morloc version's pin
          # set. Publish it as `stdlib-snapshot.txt`; `mim new` fetches it as the
          # default stdlib and deposits it into new environments.
          fetched=""
          for branch in master main; do
            if curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused \
                 "https://raw.githubusercontent.com/morloclib/stdlib/$branch/snapshot.txt" \
                 -o stdlib-snapshot.txt; then
              fetched="$branch"; break
            fi
          done
          if [ -z "$fetched" ]; then
            echo "::error::could not fetch snapshot.txt from morloclib/stdlib (is it committed?)"
            exit 1
          fi
          echo "fetched stdlib snapshot from '$fetched' ($(grep -cv '^#' stdlib-snapshot.txt) pins)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            morloc-linux-*
            morloc-macos-*
            morloc-rust-src.tar.gz
            morloc-release-manifest.json
            morloc-lang-support.json
            stdlib-snapshot.txt
          generate_release_notes: true
