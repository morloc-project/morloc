# Release workflow: build all binaries + containers, run tests, publish release.
#
# Triggered by pushing a version tag:
#   git tag v0.68.0
#   git push origin v0.68.0
#
# Produces for each platform (linux-x86_64, linux-arm64, macos-arm64):
#   - morloc-manager  (Rust binary; the static-musl bootstrap on Linux)
#   - libmorloc.so    (Rust runtime library; .dylib on macOS)
#   - morloc-nexus    (Rust binary)
# and, on Linux only (dynamic glibc 2.31, built in container/static-build):
#   - morloc          (the Haskell compiler, for native install)
# plus a `morloc-release-manifest.json` describing the native-install trio per
# triple + the release version.
#
# All are attached to the GitHub Release, EXCEPT the macOS libmorloc.dylib /
# morloc-nexus, which are withheld until the macOS build-layer port + a macOS
# init/make smoke test land (they remain as workflow artifacts).

name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/morloc-project/morloc

jobs:
  # ---- Build Rust binaries (libmorloc + morloc-nexus + morloc-manager) per platform ----
  rust-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            method: docker
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            method: docker
          - os: macos-latest
            platform: macos-arm64
            method: native
    runs-on: ${{ matrix.os }}
    # The Linux build now also stack-builds the morloc compiler (cold, no cross-run
    # cache on ephemeral runners), which dominates the wall time.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ---- Linux: Docker container build ----
      # libmorloc.so + morloc-nexus: glibc (Ubuntu 20.04)
      # morloc-manager: static (Alpine/musl)
      # morloc compiler: Haskell/stack (Ubuntu 20.04)
      - name: Set up Docker Buildx (Linux)
        if: matrix.method == 'docker'
        uses: docker/setup-buildx-action@v3

      - name: Build Rust binaries + compiler (Linux)
        if: matrix.method == 'docker'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/static-build/Dockerfile
          tags: morloc-rust-build
          load: true
          # GHA layer cache (unlike --mount=type=cache) persists across runs, when
          # not evicted from the repo's ~10 GB LRU pool between infrequent tag builds.
          # mode=max is needed to cache the intermediate GHC dependency stage; scope
          # is per-platform so x86_64 and arm64 do not clobber each other.
          cache-from: type=gha,scope=static-build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=static-build-${{ matrix.platform }}

      - name: Extract Rust binaries (Linux)
        if: matrix.method == 'docker'
        run: |
          mkdir -p out
          docker run --rm -v "$(pwd)/out:/out" morloc-rust-build
          # Verify morloc-manager is static
          file out/morloc-manager | grep -qE "static(ally|-pie) linked"

      - name: Rename artifacts (Linux)
        if: matrix.method == 'docker'
        run: |
          mv out/morloc out/morloc-${{ matrix.platform }}
          mv out/libmorloc.so out/libmorloc-${{ matrix.platform }}.so
          mv out/morloc-nexus out/morloc-nexus-${{ matrix.platform }}
          mv out/morloc-manager out/morloc-manager-${{ matrix.platform }}

      # ---- macOS: native cargo build ----
      - name: Setup Rust (macOS)
        if: matrix.method == 'native'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (macOS)
        if: matrix.method == 'native'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            data/rust/target
          key: cargo-macos-${{ hashFiles('data/rust/Cargo.lock') }}
          restore-keys: cargo-macos-

      - name: Build Rust binaries (macOS)
        if: matrix.method == 'native'
        run: |
          cd data/rust
          # Build libmorloc (cdylib produces .dylib on macOS)
          cargo build --release -p morloc-runtime
          # Install .dylib so nexus can link against it
          mkdir -p $HOME/.local/share/morloc/lib
          cp target/release/libmorloc_runtime.dylib $HOME/.local/share/morloc/lib/libmorloc.dylib
          # Build nexus
          cargo build --release -p morloc-nexus
          # Build manager
          cargo build --release -p morloc-manager
          # Collect artifacts
          mkdir -p ../../out
          cp target/release/libmorloc_runtime.dylib ../../out/libmorloc-${{ matrix.platform }}.dylib
          cp target/release/morloc-nexus ../../out/morloc-nexus-${{ matrix.platform }}
          cp target/release/morloc-manager ../../out/morloc-manager-${{ matrix.platform }}
          strip ../../out/morloc-nexus-${{ matrix.platform }} || true
          strip ../../out/morloc-manager-${{ matrix.platform }} || true

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries-${{ matrix.platform }}
          path: out/*

  # ---- Run tests using the Rust binaries ----
  test:
    needs: rust-binary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      # rustc/cargo: morloc make compiles Rust pools, and morloc init builds the
      # rustmorloc rlib from the bundled sources (prebuilt/rust) with this toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          enable-stack: true
          stack-version: 'latest'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack/snapshots
            ~/.stack/setup-exe-cache
            .stack-work
          key: stack-deps-release-${{ hashFiles('stack.yaml.lock', 'package.yaml') }}
          restore-keys: stack-deps-release-
      - name: Increase shared memory
        run: sudo mount -o remount,size=4G /dev/shm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base-core python3 python3-dev python3-pip \
            python3-numpy g++ gcc make libgsl-dev
          python3 -m pip install --break-system-packages --upgrade setuptools pyarrow

      - name: Install Futhark (hosted-guest toolchain; not in apt)
        run: |
          curl -sSL https://futhark-lang.org/releases/futhark-0.26.4-linux-x86_64.tar.xz -o /tmp/futhark.tar.xz
          tar -xf /tmp/futhark.tar.xz -C /tmp
          make -C /tmp/futhark-0.26.4-linux-x86_64 install PREFIX="$HOME/.local"

      - name: Cache R packages
        uses: actions/cache@v4
        id: r-cache
        with:
          path: ~/R/library
          key: r-lib-${{ runner.os }}-${{ runner.arch }}

      - name: Install R packages
        if: steps.r-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/R/library
          LIBARROW_MINIMAL=true ARROW_S3=OFF ARROW_GCS=OFF \
            Rscript -e 'install.packages("arrow", lib="~/R/library", repos = "https://cloud.r-project.org")'

      - name: Download Rust binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-linux-x86_64
          path: rust-bin

      - name: Prepare Rust binaries
        run: |
          mkdir -p prebuilt
          mv rust-bin/libmorloc-linux-x86_64.so prebuilt/libmorloc.so
          mv rust-bin/morloc-nexus-linux-x86_64 prebuilt/morloc-nexus
          mv rust-bin/morloc-manager-linux-x86_64 prebuilt/morloc-manager
          # bundled crate sources: morloc init compiles rustmorloc from these
          mv rust-bin/rust prebuilt/rust
          chmod +x prebuilt/libmorloc.so prebuilt/morloc-nexus prebuilt/morloc-manager

      - name: Add morloc to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/morloc/bin" >> $GITHUB_PATH
          echo "R_LIBS_USER=$HOME/R/library" >> $GITHUB_ENV
      - name: Build morloc
        run: stack install --system-ghc --no-install-ghc --no-run-tests
      - name: Initialize morloc (using pre-built Rust binaries)
        run: |
          MORLOC_RUST_BIN=$(pwd)/prebuilt morloc init -f
          morloc install stdlib
      - name: Run tests
        run: stack test --system-ghc --no-install-ghc morloc:morloc-test
        timeout-minutes: 10

      # Stage the stack-built compiler as a release asset so morloc-manager can
      # provision it (the native + container backends download the trio; the
      # manifest below references morloc-linux-x86_64).
      - name: Stage morloc compiler for release
        run: |
          cp "$HOME/.local/bin/morloc" morloc-linux-x86_64
          strip morloc-linux-x86_64 || true
      - name: Upload morloc compiler
        uses: actions/upload-artifact@v4
        with:
          name: morloc-compiler-linux-x86_64
          path: morloc-linux-x86_64

      # Publish the language-support table (compiler-owned static data) as a
      # release asset so morloc-manager can render pixi manifests WITHOUT running
      # the compiler on the host -- essential for container builds on hosts where
      # the glibc compiler cannot execute natively (NixOS, musl, etc.).
      - name: Stage lang-support table for release
        run: morloc lang-support > morloc-lang-support.json
      - name: Upload lang-support table
        uses: actions/upload-artifact@v4
        with:
          name: morloc-lang-support
          path: morloc-lang-support.json

  # ---- Build and push container images ----
  containers:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tiny (from local source)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/tiny/Dockerfile
          tags: |
            ${{ env.IMAGE_BASE }}/morloc-tiny:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_BASE }}/morloc-tiny:edge
          # load into the local store so the `full` build can FROM it and the
          # push step can push it. GHA layer cache persists the GHC deps layer.
          load: true
          cache-from: type=gha,scope=tiny
          cache-to: type=gha,mode=max,scope=tiny

      - name: Build full (uses local tiny)
        run: |
          docker build \
            --build-arg MORLOC_VERSION=${{ steps.ver.outputs.version }} \
            -t ${{ env.IMAGE_BASE }}/morloc-full:${{ steps.ver.outputs.version }} \
            -t ${{ env.IMAGE_BASE }}/morloc-full:edge \
            container/full/

      - name: Push all images
        run: |
          for img in morloc-tiny morloc-full; do
            docker push ${{ env.IMAGE_BASE }}/${img}:${{ steps.ver.outputs.version }}
            docker push ${{ env.IMAGE_BASE }}/${img}:edge
          done

  # ---- Create GitHub Release ----
  release:
    if: always() && needs.containers.result == 'success'
    needs: [containers, rust-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'rust-binaries-*'
          merge-multiple: true

      # The stack-built compiler ships under its own truthful artifact name.
      - name: Download the morloc compiler
        uses: actions/download-artifact@v4
        with:
          name: morloc-compiler-linux-x86_64

      - name: Download the lang-support table
        uses: actions/download-artifact@v4
        with:
          name: morloc-lang-support

      - name: List artifacts
        run: ls -lh

      # rustmorloc is an rlib locked to the consumer's rustc, so it ships as
      # source (platform-independent) rather than a prebuilt binary; `morloc
      # init` compiles it locally. Consumers unpack this into their
      # MORLOC_RUST_BIN directory as `rust/`.
      - name: Package Rust sources
        run: tar czf morloc-rust-src.tar.gz rust

      # The macOS libmorloc.dylib and morloc-nexus are built for CI validation
      # but are not yet loadable end-to-end: the macOS build-layer port (dylib
      # install_name / @loader_path rpaths) and a macOS init+make smoke test are
      # still pending. Withhold them from the published Release so the native
      # download flow can never auto-select a broken binary; they remain
      # available as this run's workflow artifacts for the macOS build-out. The
      # macOS manager (the bootstrap CLI) stays a first-class asset.
      - name: Withhold untested macOS runtime binaries from the Release
        run: rm -f libmorloc-macos-arm64.dylib morloc-nexus-macos-arm64

      # A version manifest for the native-install download flow: which loose
      # artifacts make up the provisionable trio per platform triple, plus the
      # release version so `morloc init` can enforce exact-version equality
      # across the downloaded compiler/libmorloc/nexus (the interim coherence
      # check while the ABI-version gate stays deferred). Only triples with a
      # complete, tested native trio are listed; macOS is omitted until its
      # build-layer port + smoke test land, so the flow falls through to a
      # container there.
      # Built with Python so the manifest carries a SHA-256 for every published
      # asset (the download flow verifies each fetch against these) and lists a
      # triple ONLY when all four of its artifacts exist on disk -- a partial
      # triple would otherwise 404 at download time. Digests + presence are
      # computed from the actual files staged for the Release.
      - name: Generate native-install manifest
        run: |
          python3 - <<'PY'
          import json, hashlib, os
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 16), b""):
                      h.update(chunk)
              return h.hexdigest()

          candidates = {
              "linux-x86_64": {
                  "morloc": "morloc-linux-x86_64",
                  "libmorloc": "libmorloc-linux-x86_64.so",
                  "nexus": "morloc-nexus-linux-x86_64",
                  "manager": "morloc-manager-linux-x86_64",
              },
              "linux-arm64": {
                  "morloc": "morloc-linux-arm64",
                  "libmorloc": "libmorloc-linux-arm64.so",
                  "nexus": "morloc-nexus-linux-arm64",
                  "manager": "morloc-manager-linux-arm64",
              },
          }
          rust_src = "morloc-rust-src.tar.gz"
          extra = ["morloc-lang-support.json"]

          triples, digests = {}, {}
          for triple, assets in candidates.items():
              missing = [a for a in assets.values() if not os.path.exists(a)]
              if missing:
                  print(f"omitting triple {triple}; missing {missing}")
                  continue
              triples[triple] = assets
              for a in assets.values():
                  digests[a] = sha256(a)
          for a in [rust_src, *extra]:
              if os.path.exists(a):
                  digests[a] = sha256(a)

          manifest = {
              "schema": 1,
              "version": version,
              "rust_src": rust_src,
              "triples": triples,
              "sha256": digests,
          }
          with open("morloc-release-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            morloc-linux-*
            morloc-manager-*
            libmorloc-*
            morloc-nexus-*
            morloc-rust-src.tar.gz
            morloc-release-manifest.json
            morloc-lang-support.json
          generate_release_notes: true
