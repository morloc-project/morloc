[package]
name = "morloc-runtime-types"
version = "0.114.0"
edition = "2021"
description = "Stateless morloc runtime types and pure functions shared between libmorloc.so and morloc-nexus"
# The compiler's version (SHIM-7); scripts/bump-version.sh sets it.

[lib]
crate-type = ["rlib"]

[features]
# Hooks that let another crate's tests refuse frame-decoding threads.
test-hooks = []

[dependencies]
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
twox-hash = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }
memchr = "2"
simdutf8 = { workspace = true }
