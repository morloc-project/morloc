# Conda requirements for the cppmorloc binder. C++ has no versioned runtime (the
# standard, not a package version), so there is no `runtime:` block.
requires:
  # Pinned with the core toolchain's c-compiler/cxx-compiler, for the same
  # reason: 2.x carries no compiler activation.
  - { package: cxx-compiler, version: "==1.11.0", phase: build }
