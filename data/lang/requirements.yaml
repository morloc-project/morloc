# Core morloc build toolchain -- the conda packages required to build the morloc
# runtime (libmorloc.so, morloc-nexus, rustmorloc) regardless of which pool
# languages a program uses. Cross-cutting, so it lives here beside languages.yaml
# rather than under a single language.
#
# Per-language requirements live in data/lang/<lang>/requirements.yaml.
toolchain:
  - { package: rust,         version: "*", phase: build }
  # c-compiler and cxx-compiler are both core: the runtime and every pool build
  # (cargo/cc-rs and the C++ pools) need the conda toolchain ACTIVATION -- the
  # activate.d scripts that export $CC/$CXX/$AR/$RANLIB/... In a language-free
  # solve (e.g. `morloc-env clean`, which resets to a baseline that declares no
  # pool language), c-compiler alone lands the compiler binaries but NOT the
  # activation packages (gcc_linux-64/binutils_linux-64), so $AR is unset and
  # cc-rs fails with "failed to find tool ar". cxx-compiler hard-depends on that
  # activation chain, so keeping it in core guarantees $AR is always exported,
  # not only when a program happens to declare a cpp pool.
  - { package: c-compiler,   version: "*", phase: build }
  - { package: cxx-compiler, version: "*", phase: build }
  - { package: make,         version: "*", phase: build }
  - { package: pkg-config,   version: "*", phase: build }
  # git is universal to the installation system: `morloc install` clones modules
  # and resolves git-pinned morloc-dependencies (build AND interactive runtime).
  - { package: git,         version: "*", phase: both }

# APT packages the dev environment installs to build the morloc COMPILER from
# source. Used ONLY by dev environments (`morloc-manager new --dev`, always a
# debian/ubuntu container); released environments download a prebuilt compiler and
# never use this list. These are NOT conda packages: they let the developer build
# the Haskell compiler in the dev shell with conda DEACTIVATED, so GHC links the
# system (apt) libraries rather than the mounted /env conda libraries. The Haskell
# toolchain itself (GHC + stack) is provisioned by ghcup baked into the container
# image (conda's ghc/stack are too old, and conda-forge has no GHC 9.6); these apt
# packages are the C toolchain + the libraries that GHC bindist and the compiler's
# Haskell deps link:
# build-essential (gcc/g++/make), libgmp-dev (integer-gmp), libncurses-dev
# (libtinfo, GHC + ghci), zlib1g-dev, libffi-dev (the RTS), xz-utils (to unpack the
# GHC bindist), pkg-config, and git.
dev-apt:
  - build-essential
  - libgmp-dev
  - libncurses-dev
  - zlib1g-dev
  - libffi-dev
  - xz-utils
  - pkg-config
  - git
