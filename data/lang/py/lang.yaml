# Python language descriptor for morloc compiler
# Metadata fields (read by LangRegistry) + descriptor fields (read by generic translator)

# Identity and metadata
name: py
extension: py
aliases: ["python", "python3"]
is_compiled: false
run_command: ["python3"]
serial_type: "str"
cost: 3
# Python's str natively supports interior NUL bytes.
allow_string_null: true
preamble:
  # Two steps, in this order, on purpose. The morloc-owned directories go on
  # first so that `import pymorloc` below cannot be answered by a user source
  # file named pymorloc.py; the program's own source root goes on afterwards so
  # that user code still takes precedence for everything else. The resulting
  # sys.path is the same either way -- only the moment of the import differs.
  - 'sys.path = [os.path.expanduser("{{opt}}"), os.path.expanduser("{{lib}}"), os.path.expanduser("{{state}}/modules/python")] + sys.path'
  - "import importlib"
  - "import pymorloc as morloc"
  - 'sys.path = [os.path.normpath(os.path.join(os.path.dirname(os.path.abspath(__file__)), "..", "..", "..")), os.path.expanduser(".")] + sys.path'

# Literals
ldBoolTrue: "True"
ldBoolFalse: "False"
ldNullLiteral: "None"
ldNullCheckTemplate: "{{expr}} is not None"
ldRealPosInf: "float('inf')"
ldRealNegInf: "float('-inf')"
ldRealNaN: "float('nan')"

# Constructors
ldListStyle: bracket
ldTupleConstructor: ""
ldRecordConstructor: "OrderedDict"
ldRecordSeparator: "="

# Access styles
ldIndexStyle: zero_bracket
ldKeyAccess: "bracket"
ldFieldAccess: dot

# Serialize/deserialize
ldSerializeFn: "morloc.put_value"
ldDeserializeFn: "morloc.get_value"
ldReleasePacketFn: "morloc.release_packet_shm"
ldIntrinsicPrefix: "morloc."
ldHelperVarPrefix: "__morloc_"

# Foreign call
ldForeignCallFn: "morloc.foreign_call"
ldForeignCallIntSuffix: ""

# Remote call
ldRemoteCallFn: "morloc.remote_call"

# Record handling
ldDictStyleRecords: true
ldQuoteRecordKeys: false

# Import syntax
ldQualifiedImports: true
ldIncludeRelToFile: false

# Template fields
# A sourced symbol is a Python identifier or operator, emitted verbatim.
ldNamePattern: "[A-Za-z_][A-Za-z0-9_.]*"
ldOperatorPattern: "[-!%&*+./<=>^|$~@:?]+"
ldAssignOp: "="
ldLambdaTemplate: "lambda {{args}}: {{body}}"
ldDoBlockExpr: "(lambda: {{expr}})"
ldDoBlockBlock: ""
ldPartialTemplate: "functools.partial({{fn_with_context}})"
ldImportTemplate: "{{namespace}} = _mlc_import_source(\"{{module_path}}\")"
ldSocketPathTemplate: "os.path.join(global_state[\"tmpdir\"], {{socket}})"
ldResourcePackTemplate: "struct.pack('iiii', {{mem}}, {{time}}, {{cpus}}, {{gpus}})"
ldReturnTemplate: "return({{expr}})"
ldFuncDefHeader: "def {{name}}({{args}}):"
ldBlockStyle: indent
ldBlockEnd: ""
ldErrorWrapOpen: "try:"
ldErrorWrapClose:
  - "except Exception as e:"
  - "    raise RuntimeError(f\"{e!s}\\n  at {{name}} [py] (mid={{mid}}{{srcloc_suffix}})\")"
ldPatternStyle: fstring
ldQuoteTerminator: '"""'
ldQuoteTerminatorEsc: '\"\"\"'
ldStrLiteralMap:
  str: ""
  bytes: "b"
ldMapStyle: loop_append
ldDispatchLocalHeader: "dispatch = {"
ldDispatchLocalEntry: "    {{mid}}: {{name}},"
ldDispatchLocalFooter: "}"
ldDispatchRemoteHeader: "remote_dispatch = {"
ldDispatchRemoteEntry: "    {{mid}}: {{name}}_remote,"
ldDispatchRemoteFooter: "}"
ldLogWrap: "__mlc_wrap_log"
ldClosureRegisterEntry: "dispatch[{{mid}}] = mlc_make_closure_dispatch({{mid}}, {{args}}, {{res}})"
ldClosureTableHeader: "mlc_closure_table = {}"
ldClosureTableEntry: "mlc_closure_table[{{mid}}] = {{caps}}"

# Pool template (loaded from pool.py, left empty here)
ldPoolTemplate: ""
ldBreakMarker: "# <<<BREAK>>>"
ldCommentMarker: "#"
