# Coefficients of the realizer's cost model (model/language/cost.md, COST-10),
# in nanoseconds, from the measurements of model/performance/cross-language.md.

# A call in one pool: the language's own call plus the generated wrapper
# (XL-2). R's figure is its wrapper alone; its measured loop is dominated by
# 64-bit integer arithmetic.
call_overhead_ns:
  c: 0.73
  cpp: 0.73
  futhark: 0.73
  rust: 0.88
  py: 78.6
  r: 850

# A language with no entry above.
default_call_overhead_ns: 100

# A round trip between two pools (XL-1), keyed by the pools' languages
# (a guest language crosses as its host). The most specific entry wins: the
# exact pair, then (*, to), then (from, *), then (*, *). Languages that
# share a pool cross nothing.
crossing_latency_ns:
  - {from: "*", to: r, ns: 100000}
  - {from: r, to: "*", ns: 100000}

# A pair no entry matches.
default_crossing_latency_ns: 20000
