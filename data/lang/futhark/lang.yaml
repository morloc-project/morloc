name: futhark
extension: fut
aliases: ["fut"]
is_compiled: true
run_command: []
serial_type: "uint8_t*"
cost: 0
allow_string_null: true

# Futhark is a "hosted guest": it has no pool of its own. Its sourced functions
# are compiled to a C library and called from generated C++ glue in the cpp
# pool. `host` names the language whose pool/translator hosts it.
host: cpp

# Sourced Futhark identifiers (entry-point names) must match this.
ldNamePattern: "[A-Za-z_][A-Za-z0-9_']*"
ldOperatorPattern: "[-!%&*+./<=>^|~]+"

# The build recipe, element-type map, and ABI semantics live in the Haskell
# guest module (Morloc.CodeGenerator.Guest.Futhark). This descriptor carries
# only registration metadata.
